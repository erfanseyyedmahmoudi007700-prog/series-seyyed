<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آرشیو سریال‌های من | Series Seyyed</title>
  
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --card-border: #232b38;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --watching: #e59934;
      --friend-badge: #8b5cf6;
      --top-rating: #eab308;
      --imdb-yellow: #f5c518;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: rgba(21, 26, 35, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky; top: 0; z-index: 50;
      padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.4rem; font-weight: 800; color: var(--accent); }
    .header-actions { display: flex; gap: 10px; align-items: center; }

    .btn {
      background: var(--accent); color: #082f49; border: none;
      padding: 10px 18px; border-radius: 8px; font-size: 0.95rem;
      font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      transition: all 0.2s ease;
    }
    .btn:hover { background: var(--accent-hover); color: #fff; transform: translateY(-1px); }

    .btn-imdb {
      background: var(--imdb-yellow); color: #000; font-weight: 800;
      padding: 0 16px; border: none; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; white-space: nowrap;
    }
    .btn-imdb:hover { opacity: 0.9; }

    .btn-secondary { background: #1e293b; color: var(--text-main); border: 1px solid var(--card-border); }
    .btn-secondary:hover { background: #334155; }

    .btn-icon {
      background: #151a23; border: 1px solid var(--card-border); color: var(--text-muted);
      width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all 0.2s;
    }
    .btn-icon:hover { color: var(--danger); border-color: var(--danger); }

    .container { max-width: 1280px; margin: 0 auto; padding: 24px 20px; width: 100%; flex: 1; }

    .view-tabs { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; flex-wrap: wrap; }
    .tab-btn {
      background: #101520; color: var(--text-muted); border: 1px solid var(--card-border);
      padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: all 0.2s;
    }
    .tab-btn.active { background: var(--card-bg); color: var(--accent); border-color: var(--accent); }
    .tab-btn.tab-top.active { color: var(--top-rating); border-color: var(--top-rating); }

    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 14px 18px; border-radius: 10px; display: flex; align-items: center; gap: 14px;
    }
    .stat-card i { font-size: 1.8rem; color: var(--accent); }
    .stat-info div:first-child { font-size: 0.8rem; color: var(--text-muted); }
    .stat-info div:last-child { font-size: 1.25rem; font-weight: bold; }

    .controls-panel {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 18px 20px; margin-bottom: 24px;
      display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;
    }

    .search-box { flex: 1; min-width: 260px; position: relative; }
    .search-box i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .search-box input {
      width: 100%; padding: 10px 42px 10px 14px; background: #0f141c;
      border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-main); font-size: 0.95rem; outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }

    .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
    select {
      background: #0f141c; border: 1px solid var(--card-border); color: var(--text-main);
      padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; cursor: pointer;
    }

    .series-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
    .series-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .series-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4); border-color: #3b4759; }

    .poster-box { width: 100%; height: 330px; position: relative; background: #111620; overflow: hidden; }
    .poster-box img { width: 100%; height: 100%; object-fit: cover; }
    .poster-fallback { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); gap: 8px; }

    .badge-status { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; backdrop-filter: blur(8px); }
    .status-completed { background: rgba(16, 185, 129, 0.9); color: #fff; }
    .status-watching { background: rgba(229, 153, 52, 0.85); color: #000; }
    .status-plan { background: rgba(56, 189, 248, 0.85); color: #000; }

    .badge-progress {
      position: absolute; bottom: 12px; left: 12px; background: rgba(2, 132, 199, 0.9);
      color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 800;
      backdrop-filter: blur(8px); display: flex; align-items: center; gap: 5px;
      direction: ltr;
    }

    .badge-friend {
      position: absolute; bottom: 12px; right: 12px; background: rgba(139, 92, 246, 0.85);
      color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
      backdrop-filter: blur(8px); display: flex; align-items: center; gap: 5px;
    }
    .badge-ten {
      position: absolute; top: 12px; right: 12px; background: rgba(234, 179, 8, 0.95);
      color: #000; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 4px;
    }

    .series-body { padding: 16px; display: flex; flex-direction: column; flex: 1; gap: 6px; }
    .series-title { font-size: 1.1rem; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .series-creator { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    
    .series-progress-box {
      background: #0d1219; border: 1px solid var(--card-border); border-radius: 6px;
      padding: 7px 10px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center;
      margin-top: 4px; font-weight: 700;
    }
    .series-progress-box.completed {
      background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); color: var(--success);
    }
    .series-progress-box.ongoing {
      color: var(--accent);
    }

    .series-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-size: 0.85rem; }
    .rating-badge { display: inline-flex; align-items: center; gap: 4px; color: #f59e0b; font-weight: bold; }
    .rating-badge.is-perfect { color: #eab308; background: rgba(234, 179, 8, 0.15); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(234, 179, 8, 0.4); }
    
    .series-notes {
      font-size: 0.8rem; color: #94a3b8; margin-top: 8px; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px;
    }

    .card-actions {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
      background: rgba(0, 0, 0, 0.2); border-top: 1px solid var(--card-border); min-height: 48px;
    }
    .action-group { display: flex; gap: 6px; margin-right: auto; }
    .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.95rem; padding: 6px; border-radius: 4px; }
    .action-btn:hover { color: var(--text-main); }
    .action-btn.delete:hover { color: var(--danger); }
    
    .quick-ep-btn {
      background: #1e293b; color: var(--accent); border: 1px solid #334155;
      border-radius: 6px; padding: 4px 10px; font-size: 0.78rem; font-weight: bold;
      cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    }
    .quick-ep-btn:hover { background: var(--accent); color: #000; }

    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; padding: 16px;
    }
    .modal {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; width: 100%; max-width: 520px; overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 1.15rem; color: var(--accent); }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; max-height: 75vh; overflow-y: auto; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); }
    .form-group input, .form-group textarea, .form-group select {
      background: #0d1219; border: 1px solid var(--card-border); border-radius: 8px;
      padding: 10px 14px; color: var(--text-main); outline: none;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent); }

    .input-with-btn { display: flex; gap: 8px; }
    .input-with-btn input { flex: 1; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .progress-picker-box {
      background: #0f141c; border: 1px dashed #334155; border-radius: 8px; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    
    .checkbox-container {
      display: flex; align-items: center; gap: 9px; cursor: pointer; user-select: none;
      background: rgba(16, 185, 129, 0.08); padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .checkbox-container input[type="checkbox"] {
      width: 18px; height: 18px; cursor: pointer; accent-color: var(--success);
    }
    .checkbox-container span { font-size: 0.9rem; font-weight: 700; color: var(--success); }

    .modal-footer {
      padding: 16px 24px; border-top: 1px solid var(--card-border);
      display: flex; justify-content: flex-end; gap: 12px; background: rgba(0, 0, 0, 0.15);
    }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1 / -1; }
    .empty-state i { font-size: 3rem; margin-bottom: 14px; color: #334155; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-tv"></i>
      <span>سریال‌های من</span>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="openAddModal()">
        <i class="fa-solid fa-plus"></i>
        <span>افزودن سریال</span>
      </button>
      <button class="btn-icon" title="خروج از حالت مدیریت (پاک کردن رمز ذخیره‌شده)" onclick="logoutAdmin()">
        <i class="fa-solid fa-lock"></i>
      </button>
    </div>
  </header>

  <div class="container">
    
    <div class="view-tabs">
      <button class="tab-btn active" id="tabAll" onclick="switchTab('all')">
        <i class="fa-solid fa-layer-group"></i>
        <span>تمام سریال‌ها</span>
      </button>
      <button class="tab-btn tab-top" id="tabTopTen" onclick="switchTab('top10')">
        <i class="fa-solid fa-crown" style="color: var(--top-rating);"></i>
        <span>سریال‌های ۱۰ از ۱۰</span>
      </button>
      <button class="tab-btn" id="tabMine" onclick="switchTab('mine')">
        <i class="fa-solid fa-user"></i>
        <span>آرشیو شخصی من</span>
      </button>
      <button class="tab-btn" id="tabFriends" onclick="switchTab('friends')">
        <i class="fa-solid fa-user-group"></i>
        <span>پیشنهادی دوستان</span>
      </button>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <i class="fa-solid fa-tv"></i>
        <div class="stat-info">
          <div>عناوین در این بخش</div>
          <div id="statTotal">۰</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-crown" style="color: var(--top-rating);"></i>
        <div class="stat-info">
          <div>شاهکارها (۱۰ از ۱۰)</div>
          <div id="statTenCount">۰</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-play" style="color: var(--watching);"></i>
        <div class="stat-info">
          <div>در حال تماشا</div>
          <div id="statWatching">۰</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-circle-check" style="color: var(--success);"></i>
        <div class="stat-info">
          <div>دیده‌شده کامل</div>
          <div id="statCompleted">۰</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-bookmark" style="color: var(--accent);"></i>
        <div class="stat-info">
          <div>در صف تماشا</div>
          <div id="statPlan">۰</div>
        </div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="جستجو بر اساس نام سریال، سازنده یا نام دوست..." oninput="filterSeries()">
      </div>
      <div class="filter-group">
        <select id="statusFilter" onchange="filterSeries()">
          <option value="all">همه وضعیت‌ها</option>
          <option value="watching">در حال تماشا</option>
          <option value="completed">دیده‌شده کامل</option>
          <option value="plan">در صف تماشا</option>
        </select>
        <select id="sortSelect" onchange="filterSeries()">
          <option value="newest">جدیدترین‌های ثبت‌شده</option>
          <option value="ratingDesc">بیشترین امتیاز شخصی</option>
          <option value="imdbDesc">بیشترین امتیاز IMDb</option>
          <option value="yearDesc">سال انتشار (نزولی)</option>
        </select>
      </div>
    </div>

    <div class="series-grid" id="seriesContainer">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>در حال بارگذاری آرشیو سریال‌ها...</p>
      </div>
    </div>

  </div>

  <!-- مودال ثبت / ویرایش سریال -->
  <div class="modal-backdrop" id="seriesModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">ثبت سریال جدید</h3>
        <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="seriesForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editKey">
        <div class="modal-body">
          <div class="form-group">
            <label>عنوان سریال (انگلیسی وارد کنید تا دقیق پیدا شود) *</label>
            <div class="input-with-btn">
              <input type="text" id="seriesTitleInput" required placeholder="مثال: True Detective یا BoJack Horseman">
              <button type="button" class="btn-imdb" id="fetchImdbBtn" onclick="fetchFromIMDb()">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span id="imdbBtnText">یافتن در IMDb</span>
              </button>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>سازنده / کارگردان</label>
              <input type="text" id="creatorInput" placeholder="سازنده سریال...">
            </div>
            <div class="form-group">
              <label>سال شروع / دوره پخش</label>
              <input type="text" id="yearInput" placeholder="مثال: 2014– یا 2008–2013">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>تعداد کل فصل‌ها</label>
              <input type="number" id="seasonsInput" min="1" placeholder="مثال: 4">
            </div>
            <div class="form-group">
              <label>وضعیت کلی اثر</label>
              <select id="watchStatusInput" onchange="handleWatchStatusChange()">
                <option value="plan">می‌خواهم ببینم (Watchlist)</option>
                <option value="watching">در حال تماشا</option>
                <option value="completed">کامل دیده‌ام (پایان‌یافته)</option>
              </select>
            </div>
          </div>

          <!-- بخش انتخاب پیشرفت و تیک پایان یافته -->
          <div class="progress-picker-box">
            <label class="checkbox-container">
              <input type="checkbox" id="isCompletedCheckbox" onchange="toggleCompletedCheckbox()">
              <span><i class="fa-solid fa-check-circle"></i> پایان‌یافته (تمام قسمت‌ها را دیده‌ام)</span>
            </label>

            <div class="form-row" id="seasonEpisodeRow">
              <div class="form-group">
                <label>فصل دیده‌شده</label>
                <select id="currentSeasonSelect"></select>
              </div>
              <div class="form-group">
                <label>قسمت دیده‌شده</label>
                <select id="currentEpisodeSelect"></select>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>پیشنهاددهنده (دوست)</label>
              <input type="text" id="suggestedByInput" placeholder="نام دوست (اختیاری)...">
            </div>
            <div class="form-group">
              <label>امتیاز شخصی (از ۱۰)</label>
              <input type="number" id="ratingInput" step="0.1" min="0" max="10" placeholder="مثال: 10 یا 9.2">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>امتیاز رسمی IMDb</label>
              <input type="number" id="imdbInput" step="0.1" min="0" max="10" placeholder="دریافت خودکار...">
            </div>
            <div class="form-group">
              <label>لینک پوستر سریال (URL)</label>
              <input type="url" id="posterInput" placeholder="دریافت خودکار پوستر...">
            </div>
          </div>

          <div class="form-group">
            <label>خلاصه داستان / یادداشت شخصی</label>
            <textarea id="notesInput" rows="3" placeholder="خلاصه یا یادداشت شخصی درباره سریال..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">انصراف</button>
          <button type="submit" class="btn">ذخیره سریال</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const OMDB_API_KEY = "ba5115ac";

    const firebaseConfig = {
      apiKey: "AIzaSyBsu8JMHum33C-LUIZiTLO1v-D1qJJr1_Y",
      authDomain: "cinema-seyyed.firebaseapp.com",
      databaseURL: "https://cinema-seyyed-default-rtdb.firebaseio.com",
      projectId: "cinema-seyyed",
      storageBucket: "cinema-seyyed.firebasestorage.app",
      messagingSenderId: "337880714768",
      appId: "1:337880714768:web:d3e7cc2c5b14712614c495"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const seriesRef = db.ref('series');

    let allSeries = [];
    let currentTab = 'all';

    const ADMIN_PASSWORD = "007";
    const AUTH_KEY = "series_admin_authed";

    function populateSeasonEpisodeOptions() {
      const sSelect = document.getElementById('currentSeasonSelect');
      const eSelect = document.getElementById('currentEpisodeSelect');

      sSelect.innerHTML = '<option value="0">شروع نشده (0)</option>';
      for (let i = 1; i <= 30; i++) {
        sSelect.innerHTML += `<option value="${i}">فصل ${i}</option>`;
      }

      eSelect.innerHTML = '<option value="0">قسمت 0 (شروع نشده)</option>';
      for (let i = 1; i <= 50; i++) {
        eSelect.innerHTML += `<option value="${i}">قسمت ${i}</option>`;
      }
    }
    populateSeasonEpisodeOptions();

    // مدیریت تیک پایان‌یافته در فرم
    function toggleCompletedCheckbox() {
      const isChecked = document.getElementById('isCompletedCheckbox').checked;
      const row = document.getElementById('seasonEpisodeRow');
      const statusSelect = document.getElementById('watchStatusInput');

      if (isChecked) {
        row.style.opacity = '0.35';
        row.style.pointerEvents = 'none';
        statusSelect.value = 'completed';
      } else {
        row.style.opacity = '1';
        row.style.pointerEvents = 'auto';
        if (statusSelect.value === 'completed') {
          statusSelect.value = 'watching';
        }
      }
    }

    function handleWatchStatusChange() {
      const status = document.getElementById('watchStatusInput').value;
      const checkbox = document.getElementById('isCompletedCheckbox');
      if (status === 'completed') {
        checkbox.checked = true;
      } else {
        checkbox.checked = false;
      }
      toggleCompletedCheckbox();
    }

    function checkAdminAuth() {
      if (localStorage.getItem(AUTH_KEY) === "true") {
        return true;
      }
      const pass = prompt("🔒 لطفاً رمز عبور را وارد کنید:");
      if (pass === null) return false;
      if (pass.trim() === ADMIN_PASSWORD) {
        localStorage.setItem(AUTH_KEY, "true");
        return true;
      } else {
        alert("⛔ رمز عبور اشتباه است!");
        return false;
      }
    }

    function logoutAdmin() {
      if (localStorage.getItem(AUTH_KEY) === "true") {
        localStorage.removeItem(AUTH_KEY);
        alert("🔒 دسترسی مدیریت قفل شد.");
      } else {
        alert("سیستم در حال حاضر قفل است.");
      }
    }

    function isPerfectTen(rating) {
      const num = parseFloat(rating);
      return !isNaN(num) && num === 10;
    }

    async function fetchFromIMDb() {
      const titleInput = document.getElementById('seriesTitleInput');
      const title = titleInput.value.trim();
      if (!title) {
        alert('لطفاً ابتدا نام سریال را تایپ کنید.');
        return;
      }

      const btnText = document.getElementById('imdbBtnText');
      btnText.innerText = 'در حال جستجو...';

      try {
        const url = `https://www.omdbapi.com/?t=${encodeURIComponent(title)}&type=series&apikey=${OMDB_API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.Response === "True") {
          titleInput.value = data.Title || title;
          document.getElementById('creatorInput').value = (data.Writer && data.Writer !== "N/A") ? data.Writer : (data.Director !== "N/A" ? data.Director : '');
          document.getElementById('yearInput').value = data.Year || '';
          document.getElementById('seasonsInput').value = data.totalSeasons ? parseInt(data.totalSeasons) : '';
          document.getElementById('imdbInput').value = (data.imdbRating && data.imdbRating !== "N/A") ? data.imdbRating : '';
          
          if (data.Poster && data.Poster !== "N/A") {
            document.getElementById('posterInput').value = data.Poster.replace(/^http:\/\//i, 'https://');
          }
          
          document.getElementById('notesInput').value = (data.Plot && data.Plot !== "N/A") ? data.Plot : '';
        } else {
          alert('سریالی با این نام در IMDb یافت نشد: ' + (data.Error || 'نام انگلیسی دقیق را وارد کنید.'));
        }
      } catch (err) {
        alert('خطا در ارتباط با سرور IMDb.');
        console.error(err);
      } finally {
        btnText.innerText = 'یافتن در IMDb';
      }
    }

    seriesRef.on('value', snapshot => {
      const data = snapshot.val();
      allSeries = [];
      if (data) {
        Object.keys(data).forEach(key => {
          allSeries.push({ key, ...data[key] });
        });
      }
      updateStats();
      filterSeries();
    }, error => {
      console.error("Firebase Error:", error);
      document.getElementById('seriesContainer').innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i>
          <p style="color: var(--danger); font-weight: bold;">خطای دسترسی به دیتابیس فایربیس</p>
        </div>`;
    });

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tab === 'all') document.getElementById('tabAll').classList.add('active');
      if (tab === 'top10') document.getElementById('tabTopTen').classList.add('active');
      if (tab === 'mine') document.getElementById('tabMine').classList.add('active');
      if (tab === 'friends') document.getElementById('tabFriends').classList.add('active');
      
      updateStats();
      filterSeries();
    }

    function updateStats() {
      let currentList = allSeries;
      if (currentTab === 'top10') {
        currentList = allSeries.filter(s => isPerfectTen(s.rating));
      } else if (currentTab === 'mine') {
        currentList = allSeries.filter(s => !s.suggestedBy || s.suggestedBy.trim() === '');
      } else if (currentTab === 'friends') {
        currentList = allSeries.filter(s => s.suggestedBy && s.suggestedBy.trim() !== '');
      }

      const total = currentList.length;
      const completed = currentList.filter(s => s.isCompleted || s.status === 'completed').length;
      const watching = currentList.filter(s => !s.isCompleted && s.status === 'watching').length;
      const plan = currentList.filter(s => !s.isCompleted && s.status === 'plan').length;
      const tenCount = allSeries.filter(s => isPerfectTen(s.rating)).length;

      document.getElementById('statTotal').innerText = total.toLocaleString('fa-IR');
      document.getElementById('statTenCount').innerText = tenCount.toLocaleString('fa-IR');
      document.getElementById('statWatching').innerText = watching.toLocaleString('fa-IR');
      document.getElementById('statCompleted').innerText = completed.toLocaleString('fa-IR');
      document.getElementById('statPlan').innerText = plan.toLocaleString('fa-IR');
    }

    function filterSeries() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      const sortBy = document.getElementById('sortSelect').value;

      let filtered = allSeries.filter(item => {
        if (currentTab === 'top10' && !isPerfectTen(item.rating)) return false;
        if (currentTab === 'mine' && item.suggestedBy && item.suggestedBy.trim() !== '') return false;
        if (currentTab === 'friends' && (!item.suggestedBy || item.suggestedBy.trim() === '')) return false;

        const matchesQuery = (item.title && item.title.toLowerCase().includes(query)) ||
                             (item.creator && item.creator.toLowerCase().includes(query)) ||
                             (item.suggestedBy && item.suggestedBy.toLowerCase().includes(query));
        
        let matchesStatus = true;
        if (statusFilter === 'completed') {
          matchesStatus = item.isCompleted || item.status === 'completed';
        } else if (statusFilter === 'watching') {
          matchesStatus = !item.isCompleted && item.status === 'watching';
        } else if (statusFilter === 'plan') {
          matchesStatus = !item.isCompleted && item.status === 'plan';
        }

        return matchesQuery && matchesStatus;
      });

      filtered.sort((a, b) => {
        if (sortBy === 'newest') return (b.createdAt || 0) - (a.createdAt || 0);
        if (sortBy === 'ratingDesc') return (parseFloat(b.rating) || 0) - (parseFloat(a.rating) || 0);
        if (sortBy === 'imdbDesc') return (parseFloat(b.imdbRating) || 0) - (parseFloat(a.imdbRating) || 0);
        if (sortBy === 'yearDesc') return parseInt(b.year || 0) - parseInt(a.year || 0);
        return 0;
      });

      renderSeries(filtered);
    }

    function renderSeries(list) {
      const container = document.getElementById('seriesContainer');
      if (list.length === 0) {
        let emptyMsg = 'هنوز سریالی در این بخش ثبت نشده است.';
        if (currentTab === 'top10') {
          emptyMsg = 'هنوز سریالی با امتیاز ۱۰ ثبت نشده است!';
        }
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-tv"></i>
            <p>${emptyMsg}</p>
            <p style="font-size: 0.85rem; margin-top: 6px;">روی دکمه «افزودن سریال» در بالا کلیک کنید.</p>
          </div>`;
        return;
      }

      container.innerHTML = list.map(item => {
        const isTen = isPerfectTen(item.rating);
        const isDone = item.isCompleted || item.status === 'completed';

        let statusClass = 'status-plan';
        let statusText = 'در صف تماشا';
        if (isDone) {
          statusClass = 'status-completed';
          statusText = 'پایان یافته';
        } else if (item.status === 'watching') {
          statusClass = 'status-watching';
          statusText = 'در حال تماشا';
        }

        const currS = parseInt(item.currentSeason) || 0;
        const currE = parseInt(item.currentEpisode) || 0;
        const hasProgress = !isDone && (currS > 0 || currE > 0);

        return `
          <div class="series-card">
            <div class="poster-box">
              ${item.posterUrl 
                ? `<img src="${escapeHtml(item.posterUrl)}" alt="${escapeHtml(item.title)}" onerror="this.src='https://via.placeholder.com/300x450/151a23/94a3b8?text=No+Poster'">`
                : `<div class="poster-fallback"><i class="fa-solid fa-tv fa-2x"></i><span>بدون پوستر</span></div>`
              }
              <div class="badge-status ${statusClass}">
                ${statusText}
              </div>

              ${hasProgress ? `
                <div class="badge-progress" title="آخرین قسمت دیده‌شده">
                  <i class="fa-solid fa-play"></i> S${currS} • E${currE}
                </div>
              ` : ''}

              ${isTen ? `
                <div class="badge-ten" title="شاهکار ۱۰ از ۱۰">
                  <i class="fa-solid fa-crown"></i> 10 / 10
                </div>
              ` : ''}

              ${item.suggestedBy ? `
                <div class="badge-friend" title="پیشنهاد شده توسط ${escapeHtml(item.suggestedBy)}">
                  <i class="fa-solid fa-user-tag"></i> ${escapeHtml(item.suggestedBy)}
                </div>
              ` : ''}
            </div>

            <div class="series-body">
              <h4 class="series-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</h4>
              <div class="series-creator">
                <i class="fa-solid fa-clapperboard"></i>
                <span>${item.creator ? escapeHtml(item.creator) : 'سازنده نامشخص'}</span>
              </div>

              <div class="series-progress-box ${isDone ? 'completed' : 'ongoing'}">
                <span>وضعیت مشاهده:</span>
                <span>
                  ${isDone 
                    ? '<i class="fa-solid fa-circle-check"></i> تمام قسمت‌ها دیده شده' 
                    : (hasProgress ? `فصل ${currS} ، قسمت ${currE}` : 'هنوز شروع نشده')
                  }
                </span>
              </div>

              <div class="series-meta">
                <span>${item.year ? item.year : '—'}</span>
                <div>
                  ${item.rating ? `<span class="rating-badge ${isTen ? 'is-perfect' : ''}"><i class="fa-solid fa-star"></i> ${item.rating}</span>` : ''}
                  ${item.imdbRating ? `<span style="color:#eab308; margin-right: 6px; font-size:0.75rem;">IMDb: ${item.imdbRating}</span>` : ''}
                </div>
              </div>
              ${item.notes ? `<p class="series-notes" title="${escapeHtml(item.notes)}">${escapeHtml(item.notes)}</p>` : ''}
            </div>

            <div class="card-actions">
              ${!isDone ? `
                <button class="quick-ep-btn" title="یک قسمت جلو بردن" onclick="incrementEpisode('${item.key}', ${currS},${currE})">
                  <i class="fa-solid fa-plus"></i> ۱ قسمت
                </button>
              ` : `<div></div>`}
              <div class="action-group">
                <button class="action-btn" title="چرخش وضعیت تماشا" onclick="cycleStatus('${item.key}', '${item.status}', ${isDone})">
                  <i class="fa-solid fa-rotate"></i>
                </button>
                <button class="action-btn" title="ویرایش" onclick="editSeries('${item.key}')">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button class="action-btn delete" title="حذف" onclick="deleteSeries('${item.key}')">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openAddModal() {
      if (!checkAdminAuth()) return;

      document.getElementById('seriesForm').reset();
      document.getElementById('editKey').value = '';
      document.getElementById('isCompletedCheckbox').checked = false;
      document.getElementById('currentSeasonSelect').value = "1";
      document.getElementById('currentEpisodeSelect').value = "0";
      toggleCompletedCheckbox();

      document.getElementById('modalTitle').innerText = 'ثبت سریال جدید';
      document.getElementById('seriesModal').style.display = 'flex';
    }

    function editSeries(key) {
      if (!checkAdminAuth()) return;

      const item = allSeries.find(s => s.key === key);
      if (!item) return;

      document.getElementById('editKey').value = item.key;
      document.getElementById('seriesTitleInput').value = item.title || '';
      document.getElementById('creatorInput').value = item.creator || '';
      document.getElementById('yearInput').value = item.year || '';
      document.getElementById('seasonsInput').value = item.seasons || '';
      document.getElementById('suggestedByInput').value = item.suggestedBy || '';
      document.getElementById('ratingInput').value = item.rating || '';
      document.getElementById('imdbInput').value = item.imdbRating || '';
      document.getElementById('watchStatusInput').value = item.status || 'plan';
      
      const isDone = item.isCompleted || item.status === 'completed';
      document.getElementById('isCompletedCheckbox').checked = isDone;

      document.getElementById('currentSeasonSelect').value = item.currentSeason !== undefined ? item.currentSeason : "1";
      document.getElementById('currentEpisodeSelect').value = item.currentEpisode !== undefined ? item.currentEpisode : "0";
      document.getElementById('posterInput').value = item.posterUrl || '';
      document.getElementById('notesInput').value = item.notes || '';

      toggleCompletedCheckbox();

      document.getElementById('modalTitle').innerText = 'ویرایش سریال';
      document.getElementById('seriesModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('seriesModal').style.display = 'none';
    }

    function handleFormSubmit(e) {
      e.preventDefault();

      const key = document.getElementById('editKey').value;
      const isCompleted = document.getElementById('isCompletedCheckbox').checked;

      const seriesData = {
        title: document.getElementById('seriesTitleInput').value.trim(),
        creator: document.getElementById('creatorInput').value.trim(),
        year: document.getElementById('yearInput').value.trim(),
        seasons: document.getElementById('seasonsInput').value.trim(),
        suggestedBy: document.getElementById('suggestedByInput').value.trim(),
        rating: document.getElementById('ratingInput').value.trim(),
        imdbRating: document.getElementById('imdbInput').value.trim(),
        status: isCompleted ? 'completed' : document.getElementById('watchStatusInput').value,
        isCompleted: isCompleted,
        currentSeason: isCompleted ? 0 : (parseInt(document.getElementById('currentSeasonSelect').value) || 0),
        currentEpisode: isCompleted ? 0 : (parseInt(document.getElementById('currentEpisodeSelect').value) || 0),
        posterUrl: document.getElementById('posterInput').value.trim(),
        notes: document.getElementById('notesInput').value.trim(),
        updatedAt: Date.now()
      };

      if (key) {
        seriesRef.child(key).update(seriesData).then(() => closeModal());
      } else {
        seriesData.createdAt = Date.now();
        seriesRef.push(seriesData).then(() => closeModal());
      }
    }

    function incrementEpisode(key, season, episode) {
      let nextS = season || 1;
      let nextE = (episode || 0) + 1;
      seriesRef.child(key).update({
        currentSeason: nextS,
        currentEpisode: nextE,
        status: 'watching',
        isCompleted: false
      });
    }

    function cycleStatus(key, currentStatus, isDone) {
      let nextStatus = 'watching';
      let nextDone = false;

      if (isDone || currentStatus === 'completed') {
        nextStatus = 'plan';
        nextDone = false;
      } else if (currentStatus === 'plan') {
        nextStatus = 'watching';
        nextDone = false;
      } else if (currentStatus === 'watching') {
        nextStatus = 'completed';
        nextDone = true;
      }

      seriesRef.child(key).update({ 
        status: nextStatus,
        isCompleted: nextDone
      });
    }

    function deleteSeries(key) {
      if (confirm('آیا از حذف این سریال از آرشیو اطمینان دارید؟')) {
        seriesRef.child(key).remove();
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.onclick = function(event) {
      const modal = document.getElementById('seriesModal');
      if (event.target === modal) closeModal();
    }
  </script>
</body>
</html>
